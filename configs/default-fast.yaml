# General settings. Reference presets pin their own values.
filter: fattal1
# Effect controls use a 0..100 scale, except for positive output_gamma.
# Alpha must be positive.
# Fade 0 applies the full effect. Fade 100 bypasses the effect.
parameters:
  alpha: 1
  beta: 80
  saturation: 100
  noise: 0
  fade: 0
  # Filtered RGB uses x^(1/gamma) before quantization and fade.
  output_gamma: 1.0
  tone_strength: 100
  highlight_compression: 0
  black_level: 0
  white_level: 100
  vibrance: 0
# max_edge controls effect working resolution, not output dimensions.
# max_input_pixels caps decoded image area before the effect.
# Null limits use the selected device_class budget.
processing:
  device_class: medium
  max_edge: null
  max_input_pixels: null
  limit_input_pixels: true
  resize: true
  transparency: reject
  blend_mode: normal
  working_resampler: nearest
# File inputs receive EXIF orientation and ICC interpretation here.
# Decoded RGB arrays and frame streams must already be interpreted.
image:
  color_space: srgb
  color_backend: matrix_trc
  exif_orientation: apply
  decode_sampling: true
# Image encoding settings do not affect in-memory frame outputs.
output:
  format: jpeg
  jpeg_quality: 100
  jpeg_subsampling: '420'
  embed_icc: false
  jpeg_background: null
# Experimental controls for the deterministic gradient-domain core.
# Reference presets fix these independently of general defaults.
numerics:
  iterations: 80
  relaxation: 1.9
  pyramid_min_size: 32
  normalization_low: 0.001
  normalization_high: 0.995
  normalization_floor: 0.0001
  gradient_threshold: 0.0001
  log_offset: 0.01
  shadow_threshold: 6
  shadow_softness: 6
  luminance_mode: rounded
  detail_level: 0
  power_mode: approximate
schema_version: 1
video:
  calibration_cache: true
  gpu_iterations: 80
  lighting_scale: 1.0
  decode_prefetch: 0
  pinned_frames: true
  gpu_buffer_reuse: true
  gpu_cleanup_graph: true
  solver_halo: 64
  pipeline_depth: 3
  validation_mode: stream
  encoder: h264_nvenc
  filter_backend: auto
  nvenc_cq: 18
  nvenc_preset: p4
  crf: 18
  preset: medium
  deblock: off
  deband: off
  flat_cleanup: 0.0
  flat_cleanup_mode: standard
  flat_cleanup_coarse_strength: 1.0
  flat_cleanup_sigma: 1.2
