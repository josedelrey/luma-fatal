[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "luma-fatal"
version = "0.1.0"
description = "Configurable gradient-domain image and video processing"
readme = "README.md"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "Pillow>=13,<14", "numba>=0.61,<1", "PyYAML>=6.0.3,<7", "tqdm>=4.67,<5"]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=14.2,<15",
    "nvidia-cuda-runtime-cu12==12.9.*",
    "nvidia-cuda-nvrtc-cu12==12.9.*",
]

[project.scripts]
luma-fatal = "luma_fatal.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
