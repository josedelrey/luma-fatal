[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "luma-fatal"
version = "0.1.0"
description = "Configurable gradient-domain image and video processing"
readme = "README.md"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "Pillow>=11,<13", "numba>=0.61,<1", "PyYAML>=6.0.3,<7", "tqdm>=4.67,<5"]

[project.scripts]
luma-fatal = "luma_fatal.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src/luma_fatal"]

[tool.hatch.build.targets.sdist]
include = ["/src/luma_fatal", "/tests", "/configs", "/scripts/check_presets.py", "/scripts/build_readme_comparison.py", "/examples/lantern-garden.json", "/assets/lantern-garden-original.png", "/assets/lantern-garden-fattal-1.png", "/assets/lantern-garden-fattal-2.png", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE"]
